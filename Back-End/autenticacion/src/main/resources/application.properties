# Puerto del Microservicio de Autenticación
server.port=8080
spring.application.name=servicio-autenticacion

# Base de Datos MySQL (Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_autenticacion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8&useUnicode=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# Respaldo H2 (descomentar para pruebas en memoria sin Docker)
# spring.datasource.url=jdbc:h2:mem:bd_autenticacion;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Firma y Tiempos de Expiración JWT
jwt.secret=ClaveSecretaParaFirmarLosTokensJWTDeCatalogoChileno2026!
jwt.expiration.access-token-ms=3600000
jwt.expiration.refresh-token-ms=86400000

# URL del Microservicio de Usuarios para Feign Client
app.usuario-service.url=http://localhost:8090
