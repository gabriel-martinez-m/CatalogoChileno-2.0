# Configuración del Puerto del Microservicio
server.port=8091
spring.application.name=servicio-catalogo

# Base de Datos MySQL (Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_catalogo_productos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# Respaldo H2 (descomentar para pruebas en memoria sin Docker)
# spring.datasource.url=jdbc:h2:mem:bd_catalogo_productos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
